<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Park Road Trip</title>
    <link rel="icon" type="image/svg+xml" href="/car.svg" />
    <script>
      // Set the day/night theme before first paint so night mode never flashes
      // the day colors. Must match THEME_KEY in src/components/ThemeToggle.tsx.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var night = saved ? saved === "night" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = night ? "night" : "day";
      })();
    </script>
    <meta name="description" content="Zion, Bryce Canyon, Grand Teton and Yellowstone: a road trip in photos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700,100,1&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
